version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - PROJECT_NAME=AI Verify — Intelligent Application & Compliance Platform
      - DATABASE_URL=sqlite:///./ai_verify.db
      - SECRET_KEY=ai-verify-super-secure-production-ready-jwt-secret-key-2026
      - DEMO_MODE=true
      - STORAGE_DIR=./storage_data
    volumes:
      - ./backend/storage_data:/app/storage_data
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped
